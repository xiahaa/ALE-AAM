<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ALE-AAM 航线编辑器</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="workspace-panel">
    <header>
      <h1>ALE-AAM</h1>
      <p>离线低空环境查看与航线编辑</p>
    </header>

    <section aria-labelledby="load-title">
      <h2 id="load-title"><span>1</span> 加载数据</h2>
      <p class="hint">场景图层由启动命令加载；也可加入本地 GeoJSON 或包含 GeoJSON 的 ZIP。</p>
      <label class="basemap-field" for="basemap">底图
        <select id="basemap" disabled>
          <option value="offline">离线场景图层</option>
        </select>
      </label>
      <input id="data-file" class="file-input" type="file" accept=".geojson,.json,.zip" multiple aria-label="加载本地数据">
      <div id="layers" class="layer-list" aria-live="polite"></div>
    </section>

    <section aria-labelledby="inspect-title">
      <h2 id="inspect-title"><span>2</span> 查看环境</h2>
      <div class="coordinate-fields">
        <label>经度<input id="longitude" type="number" step="0.000001" inputmode="decimal"></label>
        <label>纬度<input id="latitude" type="number" step="0.000001" inputmode="decimal"></label>
      </div>
      <div class="button-row">
        <button id="mode-inspect" type="button" aria-pressed="true">查看</button>
        <button id="locate" type="button">定位</button>
        <button id="reset-view" type="button" class="secondary">全景</button>
      </div>
      <div id="environment" class="environment" aria-live="polite">点击地图读取地形、气象、人口和要素属性。</div>
    </section>

    <section aria-labelledby="route-title">
      <h2 id="route-title"><span>3</span> 绘制航线</h2>
      <div class="mode-switch" role="group" aria-label="地图操作模式">
        <button id="mode-draw" type="button" aria-pressed="false">画航点</button>
        <button id="mode-pan" type="button" aria-pressed="false">平移</button>
      </div>
      <p class="hint">画航点模式下点击新增；拖动航点调整位置，选中后可修改高度和速度。</p>
      <div id="waypoints" class="waypoint-list"></div>
      <button id="reset-route" type="button" class="secondary">恢复任务起终点</button>
    </section>

    <section aria-labelledby="export-title">
      <h2 id="export-title"><span>4</span> 导出</h2>
      <button id="export" type="button" class="primary" disabled>导出 GeoJSON</button>
      <output id="status" aria-live="polite">正在读取场景…</output>
    </section>
  </aside>

  <main>
    <div id="map" role="application" aria-label="交互式航线地图"></div>
    <div class="map-legend" aria-label="地图图例">
      <span><i class="legend-building"></i>建筑</span>
      <span><i class="legend-airspace"></i>限制空域</span>
      <span><i class="legend-emergency"></i>应急点</span>
      <span><i class="legend-route"></i>人工航线</span>
    </div>
    <div class="map-help">滚轮或双击缩放 · 拖动地图平移 · 坐标顺序 [经度, 纬度]</div>
    <div id="basemap-attribution" class="map-attribution" aria-live="polite">ALE-AAM 场景数据</div>
  </main>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
