[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "ale-aam-maptool"
version = "0.2.1"
description = "Deterministic offline low-altitude route planning toolkit for ALE"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {file = "LICENSE"}
authors = [{name = "ALE-AAM benchmark team"}]
dependencies = [
  "fastapi>=0.110,<1",
  "numpy>=1.24,<3",
  "Pillow>=10,<12",
  "pydantic>=2.6,<3",
  "pyproj>=3.5,<4",
  "rasterio>=1.3.9,<2",
  "shapely>=2,<3",
  "typer>=0.12,<1",
  "uvicorn>=0.29,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "jsonschema>=4.21,<5", "pytest>=8,<9"]

[project.scripts]
ale-aam-maptool = "ale_aam_maptool.cli:app"

[tool.scikit-build]
cmake.version = ">=3.20"
build-dir = "build/{wheel_tag}"
wheel.packages = ["ale_aam_maptool"]
sdist.include = ["vendor/jps3d/include/**", "vendor/jps3d/src/**", "vendor/jps3d/bindings.cpp", "vendor/jps3d/LICENSE", "vendor/eigen3/**", "THIRD_PARTY_NOTICES.md"]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux* *-win32 *-manylinux_i686"
test-requires = ["pytest", "httpx", "jsonschema"]
test-command = "python -m ale_aam_maptool doctor --json"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
