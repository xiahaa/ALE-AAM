[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ale-aam-maptool"
version = "1.0.0"
description = "Offline low-altitude GIS inspection and manual route-editing toolkit for ALE"
readme = {text = "ALE-AAM loads task GIS, exposes offline environment inspection, supports manual route editing in a local Web UI, exports GeoJSON, and performs public validation. Automatic route planning is intentionally disabled.", content-type = "text/markdown"}
requires-python = ">=3.10,<3.14"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
  {name = "Zhang Lei", email = "zhanglei@idea.edu.cn"},
  {name = "Meng Luoheng", email = "mengluoheng@idea.edu.cn"},
  {name = "Xiao Hu", email = "huxiao1@idea.edu.cn"},
]
dependencies = [
  "fastapi>=0.110,<1",
  "numpy>=1.24,<3",
  "Pillow>=10,<12",
  "pydantic>=2.6,<3",
  "pyproj>=3.5,<4",
  "rasterio>=1.3.9,<2",
  "shapely>=2,<3",
  "typer>=0.12,<1",
  "uvicorn>=0.29,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "jsonschema>=4.21,<5", "pytest>=8,<9"]

[project.scripts]
ale-aam-maptool = "ale_aam_maptool.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["ale_aam_maptool*"]

[tool.setuptools.package-data]
ale_aam_maptool = [
  "web/*.html",
  "web/*.js",
  "web/*.css",
  "web/vendor/leaflet/*",
  "web/vendor/leaflet/images/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
