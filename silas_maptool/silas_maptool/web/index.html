<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>silas-maptool 0.2</title><link rel="stylesheet" href="style.css"></head>
<body><aside><h1>silas-maptool</h1><p>离线低空航路规划演示</p>
<label>候选路线 <select id="route"><option>A — 最短直达</option><option>B — 保守安全</option><option>C — 场景优化</option></select></label>
<button id="plan">规划当前路线</button><button id="all">规划 A / B / C</button><button id="export" disabled>导出 GeoJSON</button>
<pre id="status">正在读取已绑定场景…</pre><p class="note">背景图是随场景生成的离线占用栅格；服务不读取网页提交的文件路径，也不请求地图瓦片或 CDN。</p></aside>
<main><div id="map"><img id="preview" alt="scenario occupancy grid"><svg id="routes" preserveAspectRatio="none"></svg></div></main>
<script src="app.js"></script></body></html>
